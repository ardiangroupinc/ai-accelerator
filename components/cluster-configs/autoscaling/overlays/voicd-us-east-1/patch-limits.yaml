---
# ARCH-575. Applies ONLY to the prod ZTA cluster (us-east-1-mrk95).
#
# `overlays/default` is shared with six rhoai-*-aws-gpu clusters, so anything
# sized from this cluster's node inventory belongs here, not in base.
#
# balanceSimilarNodeGroups is required, not cosmetic. Without it the autoscaler
# grows whichever single node group its expander picks, so all new capacity can
# land in one zone. Every pool here is replicated per zone (worker-{1,2,3},
# workerservices-{1,2,3}) and storage is zonal IBM VPC Block bound by
# WaitForFirstConsumer — a Pending pod holding a PV needs a node in ITS zone
# specifically, and capacity added anywhere else leaves it Pending while the
# cluster grows. Balancing keeps similar groups within one node of each other,
# which is the only behaviour that matches zonal storage.
- op: add
  path: /spec/balanceSimilarNodeGroups
  value: true

# ARCH-575 autoscaled the general worker sets 4-9 in voicdgroupinc/voicd-ops
# (previously fixed at 2 per zone and scaled by hand). Nine general workers
# instead of six adds 3 nodes / 48 cores / 192 GiB to the worst case budgeted in
# base, taking it to 31 nodes / 560 cores / 2464 GiB.
#
# Against base's 576 cores that leaves 16 cores of headroom — one node. A
# ClusterAutoscaler at its limit does not warn, it silently stops scaling every
# pool, which is the whole reason base carries margin. These restore roughly the
# margin base has always had: 9 nodes / 80 cores / 352 GiB.
- op: replace
  path: /spec/resourceLimits/maxNodesTotal
  value: 40
- op: replace
  path: /spec/resourceLimits/cores/max
  value: 640
- op: replace
  path: /spec/resourceLimits/memory/max
  value: 2816

# ARCH-589. Also cluster-specific: this is the VP hub, and the hub is where the
# imperative framework's unsealvault-cronjob runs.
#
# That cronjob fires every 5 minutes, takes ~40s, and its pods carry two emptyDir
# volumes. The autoscaler runs without --skip-nodes-with-local-storage, which
# defaults to TRUE, so for those 40s the node it landed on cannot be drained and
# is marked unremovable — which resets its unneeded timer. At unneededTime 5m the
# node needs five *continuous* unneeded minutes and only ever gets 4m20s, so the
# timer can never complete and the node is pinned for as long as the cronjob
# exists. worker-2-dhf6n sat idle for hours on exactly this.
#
# It is always the newest node, too: the scheduler's LeastAllocated scoring sends
# each run to the emptiest node, which is the one the autoscaler just added and
# is trying to remove.
#
# 3m leaves 1m20s of slack in the window. The annotation that would normally fix
# this (cluster-autoscaler.kubernetes.io/safe-to-evict) is not reachable — the
# upstream clustergroup chart hardcodes that pod template with no annotation
# hook, and Argo selfHeal reverts anything set on the live object.
#
# This is a floor on how long a node must look idle, not a delay before acting on
# one: delayAfterAdd (5m) still governs how soon after a scale-up anything can be
# removed, so a shorter unneededTime cannot make the autoscaler thrash on bursty
# load.
- op: replace
  path: /spec/scaleDown/unneededTime
  value: 3m
